<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="changelog_ui.css">
</head>
<body>

    <div class="header-row" style="justify-content: space-between;">
        <h2 class="app-title">Changelog Sidecar<span id="versionTag" class="version-tag"></span></h2>
    </div>

    <div class="theme-manager-row">
        <select id="themeSelector" onchange="changeTheme()">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="sepia">Sepia</option>
        </select>
        <button class="icon-btn" title="Import theme (.theme.json)" onclick="requestImportTheme()">⬆</button>
        <button class="icon-btn" title="Export current theme" onclick="requestExportTheme()">⬇</button>
        <button class="icon-btn" id="themeRemoveBtn" title="Select a custom (imported) theme to enable" onclick="removeSelectedTheme()" disabled>✕</button>
    </div>
    <div class="theme-reset-row">
        <span class="factory-reset-link" onclick="resetThemeCache()">Factory Reset Theme Cache</span>
    </div>

    <button class="view-log" onclick="openDashboard()">📂 OPEN LOG DASHBOARD</button>

    <div class="section-box">
        <label>Add Log Entry:</label>
        <textarea id="newEntryText" placeholder="What did you change?"></textarea>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div>
                <input type="checkbox" id="autosaveCheck" checked> <label for="autosaveCheck" style="display:inline; font-weight:normal; cursor:pointer;">Autosave Design</label>
            </div>
        </div>
        <button onclick="sendEntry()">Save Entry</button>
    </div>

    <div style="margin-top:20px;">
        <h4 style="font-size:12px; text-transform:uppercase; color:var(--text-secondary);">Utilities</h4>

        <div style="margin-bottom: 10px;">
            <input type="text" id="milestoneReason" placeholder="Milestone Name (e.g. 'Final Draft')" style="width:100%; margin-bottom:5px; padding:6px; box-sizing:border-box;">
            <button class="secondary" onclick="createMilestone()">Archive & Start New Log</button>
        </div>

        <button class="secondary" onclick="exportLog()">Export to Text File</button>
    </div>

    <script src="changelog_ui.js"></script>
</body>
</html>
